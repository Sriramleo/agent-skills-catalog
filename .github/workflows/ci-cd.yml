name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # STEP 1: Code Quality, Typecheck & Linter (Runs first)
  lint-and-quality:
    name: 1. Lint, Typecheck & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc -p tsconfig.server.json --noEmit

  # STEP 2: Automated Tests Suite (Runs only AFTER Step 1 passes)
  test-suite:
    name: 2. Automated Test Suite (Node ${{ matrix.node-version }})
    needs: [lint-and-quality]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

  # STEP 3: Production Build & Static Site Export (Runs only AFTER Step 2 passes)
  build-and-package:
    name: 3. Production Build & Static Export
    needs: [test-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Full Production Bundle
        run: npm run build

      - name: Export Static Site
        run: node bin/cli.js --export ./dist-pages

      - name: Test CLI Binary Execution
        run: node bin/cli.js --table || true

      - name: Upload Static Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-pages'

  # STEP 4: Deploy to GitHub Pages (Runs only AFTER Step 3 passes on main branch)
  deploy-pages:
    name: 4. Deploy Demo to GitHub Pages
    needs: [build-and-package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # STEP 5: Publish Package to NPM (Runs sequentially on release publish)
  publish-npm:
    name: 5. Publish to NPM Registry
    needs: [build-and-package]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Publish to NPM with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
