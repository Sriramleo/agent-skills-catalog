name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # STEP 1: Code Quality, Typecheck & Linter (Runs first)
  lint-and-quality:
    name: 1. Lint, Typecheck & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc -p tsconfig.server.json --noEmit

  # STEP 2: Automated Tests Suite (Runs only AFTER Step 1 passes)
  test-suite:
    name: 2. Automated Test Suite (Node ${{ matrix.node-version }})
    needs: [lint-and-quality]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

  # STEP 3: Production Build & Validation (Runs only AFTER Step 2 passes)
  build-and-package:
    name: 3. Production Build & Package
    needs: [test-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Full Production Bundle
        run: npm run build

      - name: Test CLI Binary Execution
        run: node bin/cli.js --table || true

  # STEP 4: Publish Package to NPM (via NPM Trusted Publishers / OIDC)
  publish-npm:
    name: 4. Publish to NPM Registry (Trusted Publisher)
    needs: [build-and-package]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM Trusted Publishing (OIDC) & Provenance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Publish to NPM via Trusted Publisher (OIDC)
        run: npm publish --provenance --access public
